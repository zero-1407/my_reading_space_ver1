# Render 배포 설정 — 저장소를 연결하면 이 파일대로 알아서 뜬다
# render.com → New → Blueprint → 이 저장소 선택
services:
  - type: web
    name: my-reading-space
    runtime: node
    plan: free
    region: singapore          # 한국에서 가장 가까운 지역
    buildCommand: ""           # 빌드할 게 없다. 정적 파일과 서버 하나뿐
    startCommand: node prototype/server.js
    healthCheckPath: /
    envVars:
      - key: KCISA_KEY         # 전시·도서 API 인증키
        sync: false            # 값은 Render 대시보드에서 직접 넣는다 (저장소에 안 올라감)
      - key: NODE_VERSION
        value: "20"
